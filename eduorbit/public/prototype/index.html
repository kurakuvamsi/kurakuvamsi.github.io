<script>
/* URL bridge: never modifies original UI, demo data, or workflows. */
(function(){
  const routes={overview:'home',students:'students',staff:'staff',attendance:'attendance',assignments:'assignments',examinations:'examinations',library:'library',timetable:'timetable',leaves:'leaves',fees:'fees',announcements:'notifications',profile:'profile'};
  function announce(page){if(window.parent!==window)window.parent.postMessage({source:'eduorbit-v7',type:'page',route:routes[page]||'home'},location.origin)}
  const previousNavigate=window.navigate;
  if(typeof previousNavigate==='function'){window.navigate=function(p){previousNavigate(p);announce(p)}}
  window.addEventListener('message',function(e){
    if(e.origin!==location.origin||!e.data||e.data.source!=='eduorbit-angular'||e.data.type!=='route')return;
    const target=Object.keys(routes).find(p=>routes[p]===e.data.route);
    if(target&&typeof user!=='undefined'&&user&&typeof navigate==='function'&&page!==target)navigate(target);
  });
  document.addEventListener('click',function(){if(typeof user!=='undefined'&&user)queueMicrotask(()=>announce(page))},true);
  window.parent!==window&&window.parent.postMessage({source:'eduorbit-v7',type:'ready'},location.origin);
})();
</script>
